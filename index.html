<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calima</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- LOGIN VIEW -->
    <div id="loginView" class="view">
        <div class="login-card">
            <img src="logo.png" alt="Calima" class="login-logo-img" />
            <h1 class="login-title">Calima</h1>
            <p class="login-subtitle">Your personal cloud storage</p>
            <button id="loginBtn" class="btn-google">
                <svg width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                    <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                    <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                    <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
                </svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" class="view hidden">
        <!-- TOPBAR -->
        <header class="topbar">
            <!-- USER MENU -->
            <div class="user-menu-wrapper">
                <button id="userMenuBtn" class="user-menu-btn">
                    <img id="userAvatar" class="user-avatar" src="" alt="User" />
                    <span id="userName" class="user-name">User</span>
                    <span class="material-icons user-chevron">expand_more</span>
                </button>
                <div id="userDropdown" class="user-dropdown hidden">
                    <button id="logoutBtn" class="dropdown-item">
                        <span class="material-icons">logout</span>
                        Sign out
                    </button>
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="topbar-actions">
                <button id="newFolderBtn" class="action-btn">
                    <span class="material-icons">create_new_folder</span>
                    <span class="action-label">Folder</span>
                </button>
                <button id="uploadBtn" class="action-btn primary">
                    <span class="material-icons">upload</span>
                    <span class="action-label">Upload</span>
                </button>
                <button id="refreshBtn" class="action-btn">
                    <span class="material-icons">refresh</span>
                    <span class="action-label">Refresh</span>
                </button>
            </div>
        </header>

        <!-- CONTENT -->
        <main class="content">
            <div id="breadcrumb" class="breadcrumb hidden"></div>
            <div id="loadingIndicator" class="loading hidden">
                <div class="spinner"></div>
            </div>
            <div id="fileGrid" class="file-grid"></div>
            <div id="emptyState" class="empty-state hidden">
                <span class="material-icons empty-icon">cloud_upload</span>
                <h2>Nothing here yet</h2>
                <p>Drag files anywhere or click Upload to get started</p>
            </div>
        </main>
    </div>

    <!-- DIALOG OVERLAY -->
    <div id="dialogOverlay" class="dialog-overlay hidden">
        <div id="dialogContent" class="dialog-card"></div>
    </div>

    <!-- DRAG & DROP OVERLAY -->
    <div id="dropOverlay" class="drop-overlay hidden">
        <div class="drop-content">
            <span class="material-icons drop-icon">cloud_upload</span>
            <h2>Drop files here</h2>
            <p>They'll be uploaded to the current folder</p>
        </div>
    </div>

    <!-- SNACKBAR -->
    <div id="snackbar" class="snackbar"></div>

    <!-- HIDDEN FILE INPUT (para el botón Upload) -->
    <input type="file" id="hiddenFileInput" multiple style="display:none" />

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="scripts.js"></script>
</body>
</html>
